worker_processes 1;

events { worker_connections 1024; }

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name localhost;

        # 将 前端/meetroom-web/public 复制为 C:/Temp/nginx-1.20.2/html/turboroom
        location / {
            root html/turboroom;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # 网页端统一通过同源地址访问 Java 后端，避免浏览器跨域。
        location /meetroom/ {
            proxy_pass http://127.0.0.1:8888/meetroom/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /pic/ {
            proxy_pass http://127.0.0.1:8888/pic/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
